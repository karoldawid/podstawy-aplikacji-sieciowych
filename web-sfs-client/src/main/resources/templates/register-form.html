<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rejestracja Klienta</title>
    <style>
        body {font-family: sans-serif; padding: 20px;}
        .form-group {margin-bottom: 15px;}
        label {display: block; font-weight: bold;}
        .error {color: red;}
        .success {color: green; }
    </style>
</head>
<body>
    <h2>Zarejestur się!</h2>
    <div th:if="${param.success}" class="success">
        <p>Rejestracja udana!</p>
    </div>
    <div th:if="${errorMessage}" class="error">
        <p th:text="${errorMessage}"></p>
    </div>

    <form th:action="@{/register}" th:object="${clientDto}" method="post">
        <div class="form-group">
            <label>Login:</label>
            <input type="text" th:field="*{login}" required/>
        </div>
        <div class="form-group">
            <label>Imię:</label>
            <input type="text" th:field="*{firstName}" required/>
        </div>
        <div class="form-group">
            <label>Nazwisko:</label>
            <input type="text" th:field="*{lastName}" required/>
        </div>

        <button type="submit">Zarejestruj</button>
    </form>

</body>
</html>
